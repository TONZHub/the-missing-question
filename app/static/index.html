<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Missing Question</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <p class="eyebrow">ADVERSARIAL REASONING SIDECAR</p>
      <h1>The Missing Question</h1>
      <p class="subtitle">Guard your momentum, not your assumptions.</p>
    </header>

    <main>
      <section class="composer" aria-labelledby="context-label">
        <label id="context-label" for="context">What are you building?</label>
        <textarea
          id="context"
          maxlength="100000"
          placeholder="Paste a product idea, architecture plan, PRD, implementation note, code diff, or decision…"
        ></textarea>

        <div class="actions">
          <button id="poke" type="button">Poke holes</button>
          <span class="hint">One question. Highest leverage.</span>
        </div>
      </section>

      <section id="status" class="status" hidden aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">Poking holes…</span>
      </section>

      <section id="message" class="message" hidden aria-live="polite"></section>
      <section id="result" class="result" hidden aria-live="polite"></section>
    </main>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
