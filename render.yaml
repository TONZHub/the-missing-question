services:
  - type: web
    name: the-missing-question
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz

    autoDeploy: true

    envVars:
      - key: NEMOTRON_API_URL
        value: https://openrouter.ai/api/v1/chat/completions

      - key: NEMOTRON_MODEL_NAME
        value: nvidia/nemotron-3.5-lightning

      - key: NEMOTRON_API_KEY
        sync: false